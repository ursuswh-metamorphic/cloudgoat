name: CloudGoat Destroy Scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        description: Select an AWS CloudGoat scenario to destroy
        required: true
        options:
          - agentcore_identity_confusion
          - beanstalk_secrets
          - bedrock_agent_hijacking
          - cloud_breach_s3
          - codebuild_secrets
          - data_secrets
          - detection_evasion
          - ec2_ssrf
          - ecs_efs_attack
          - ecs_privesc_evade_protection
          - ecs_takeover
          - federated_console_takeover
          - glue_privesc
          - iam_enum_basics
          - iam_privesc_by_attachment
          - iam_privesc_by_ec2
          - iam_privesc_by_key_rotation
          - iam_privesc_by_rollback
          - lambda_privesc
          - rce_web_app
          - rds_snapshot
          - s3_version_rollback_via_cfn
          - secrets_in_the_cloud
          - sns_secrets
          - sqs_flag_shop
          - static
          - vpc_peering_overexposed
          - vulnerable_cognito
          - vulnerable_lambda
      aws_profile:
        type: string
        description: AWS profile name used by CloudGoat Terraform providers
        required: true
        default: ci
      aws_region:
        type: string
        description: AWS region override (CloudGoat default is us-east-1)
        required: true
        default: us-east-1
      whitelist_cidr:
        type: string
        description: CIDR added to cloudgoat/whitelist.txt
        required: true
        default: 1.1.1.1/32
      user_email:
        type: string
        description: Email used by scenarios that require user_email
        required: true
        default: cloudgoat-ci@example.com
      artifact_name:
        type: string
        description: Optional artifact name to destroy (for example cloudgoat-data_secrets_cgidabcdefghij)
        required: false
      confirm_destroy:
        type: choice
        description: Safety gate for teardown
        required: true
        default: "NO"
        options:
          - "NO"
          - "YES_DESTROY"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudgoat-destroy-${{ github.event.inputs.scenario }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.scenario }}
    runs-on: ubuntu-latest
    env:
      SCENARIO: ${{ github.event.inputs.scenario }}
      AWS_PROFILE_NAME: ${{ github.event.inputs.aws_profile }}
      CLOUDGOAT_AWS_REGION: ${{ github.event.inputs.aws_region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Create shared AWS profile for Terraform
        run: |
          mkdir -p ~/.aws

          {
            echo "[$AWS_PROFILE_NAME]"
            echo "aws_access_key_id=$AWS_ACCESS_KEY_ID"
            echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY"
            if [[ -n "${AWS_SESSION_TOKEN:-}" ]]; then
              echo "aws_session_token=$AWS_SESSION_TOKEN"
            fi
          } > ~/.aws/credentials

          {
            echo "[profile $AWS_PROFILE_NAME]"
            echo "region=${{ github.event.inputs.aws_region }}"
            echo "output=json"
          } > ~/.aws/config

      - name: Install CloudGoat dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate whitelist CIDR format
        run: |
          python - <<'PY'
          import ipaddress
          cidr = "${{ github.event.inputs.whitelist_cidr }}"
          ipaddress.ip_network(cidr, strict=False)
          print(f"Validated whitelist CIDR: {cidr}")
          PY

      - name: Require explicit destroy confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm_destroy }}" != "YES_DESTROY" ]]; then
            echo "Teardown cancelled. Set confirm_destroy=YES_DESTROY to continue."
            exit 1
          fi

      - name: Resolve deploy artifact for selected scenario
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI is required but not installed on this runner."
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required but not installed on this runner."
            exit 1
          fi

          ARTIFACT_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")

          if [[ -n "${{ github.event.inputs.artifact_name }}" ]]; then
            ARTIFACT_NAME="${{ github.event.inputs.artifact_name }}"

            if [[ "$ARTIFACT_NAME" != "cloudgoat-${SCENARIO}_cgid"* ]]; then
              echo "artifact_name must match selected scenario prefix cloudgoat-${SCENARIO}_cgid*"
              exit 1
            fi

            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r --arg n "$ARTIFACT_NAME" '
              .artifacts
              | map(select(.expired == false and .name == $n))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ')
          else
            PREFIX="cloudgoat-${SCENARIO}_cgid"
            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r --arg p "$PREFIX" '
              .artifacts
              | map(select(.expired == false and (.name | startswith($p))))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ')

            ARTIFACT_NAME=$(echo "$ARTIFACT_JSON" | jq -r --arg p "$PREFIX" '
              .artifacts
              | map(select(.expired == false and (.name | startswith($p))))
              | sort_by(.created_at)
              | reverse
              | .[0].name // empty
            ')
          fi

          if [[ -z "$ARTIFACT_ID" || -z "$ARTIFACT_NAME" ]]; then
            echo "No deploy artifact found for scenario $SCENARIO."
            echo "Run the deploy workflow first, or provide a valid artifact_name input."
            exit 1
          fi

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download and restore scenario instance directory
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ARTIFACT_ID="${{ steps.artifact.outputs.artifact_id }}"
          ARTIFACT_NAME="${{ steps.artifact.outputs.artifact_name }}"
          INSTANCE_NAME="${ARTIFACT_NAME#cloudgoat-}"
          TARGET_DIR="cloudgoat/${INSTANCE_NAME}"

          mkdir -p restored

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip

          unzip -q artifact.zip -d restored

          mkdir -p "$TARGET_DIR"

          FOUND_DIR=$(find restored -type d -name "$INSTANCE_NAME" | head -n 1 || true)
          if [[ -n "$FOUND_DIR" ]]; then
            cp -a "$FOUND_DIR"/. "$TARGET_DIR"/
          else
            CANDIDATE_DIR=$(find restored -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
            if [[ -n "$CANDIDATE_DIR" ]]; then
              cp -a "$CANDIDATE_DIR"/. "$TARGET_DIR"/
            else
              cp -a restored/. "$TARGET_DIR"/
            fi
          fi

          if [[ ! -d "$TARGET_DIR/terraform" ]]; then
            echo "Restored artifact does not contain a terraform directory: $TARGET_DIR/terraform"
            exit 1
          fi

          echo "instance_name=$INSTANCE_NAME" >> "$GITHUB_OUTPUT"
          echo "instance_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare CloudGoat config and whitelist files
        run: |
          cat > cloudgoat/config.yml <<EOF
          - default-profile: ${AWS_PROFILE_NAME}
          - user_email: ${{ github.event.inputs.user_email }}
          EOF

          echo "${{ github.event.inputs.whitelist_cidr }}" > cloudgoat/whitelist.txt

      - name: Destroy selected scenario
        run: |
          python cloudgoat/cloudgoat.py destroy "$SCENARIO" --profile "$AWS_PROFILE_NAME"

      - name: Publish destroy summary
        run: |
          {
            echo "## Scenario teardown output"
            echo ""
            echo "Scenario: $SCENARIO"
            echo "Instance: ${{ steps.restore.outputs.instance_name }}"
            echo "Region: ${{ github.event.inputs.aws_region }}"
            echo "Artifact: ${{ steps.artifact.outputs.artifact_name }}"
            echo ""
            echo "Destroy command completed. Check previous steps for Terraform output."
          } >> "$GITHUB_STEP_SUMMARY"
